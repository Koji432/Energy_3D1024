<!doctype html>
<html lang="ja">
<head>
 <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
 <meta name="theme-color" content="#f3f5f7"><meta name="description" content="電気製品の分解と回路図。">
 <title>電気回路</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23245290'/%3E%3Cpath d='m18 4-9 14h7l-2 10 10-15h-7z' fill='white'/%3E%3C/svg%3E">
 <link rel="stylesheet" href="./style.css"><script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script>
</head>
<body>
 <main id="app">
  <header class="toolbar">
   <nav class="device-tabs" aria-label="モデルを選択">
    <button class="device-tab active" data-device="flashlight" aria-label="懐中電灯" aria-pressed="true"></button>
    <button class="device-tab" data-device="fan" aria-label="扇風機" aria-pressed="false"></button>
    <button class="device-tab" data-device="cleaner" aria-label="黒板消しクリーナー" aria-pressed="false"></button>
    <button class="device-tab" data-device="vacuum" aria-label="自動掃除機" aria-pressed="false"></button>
    <button class="device-tab" data-device="controller" aria-label="コントローラー" aria-pressed="false"></button>
    <button class="device-tab" data-device="drone" aria-label="ドローン" aria-pressed="false"></button>
    <button class="device-tab" data-device="roadster" aria-label="ロードスター" aria-pressed="false"></button>
   </nav>
   <div class="actions" aria-label="操作">
    <button id="disassemble" class="action primary" aria-label="分解"></button>
    <button id="view-toggle" class="action" aria-label="電気回路を表示" aria-pressed="false"></button>
   </div>
  </header>
  <section class="workspace" aria-label="モデルと回路図">
   <section id="model-panel" class="model-panel">
    <h1 id="model-title" hidden>部品の回路</h1>
    <div id="viewport" tabindex="0" aria-label="懐中電灯の3Dモデル"><div id="loading">読み込み中…</div><div id="labels" aria-hidden="true"></div></div>
    <button id="view-reset" class="view-reset" aria-label="視点を戻す" title="視点を戻す"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2"/><path d="M12 1v3m0 16v3M1 12h3m16 0h3"/></svg></button>
   </section>
   <section id="diagram-panel" class="diagram-panel" hidden>
    <h2>回路図</h2><svg id="schematic" viewBox="0 0 640 560" role="group" aria-label="回路図"></svg>
    <button id="mechanism-jump" class="mechanism-jump" aria-label="機構の詳細を見る" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 3-.7 3-2 .9L3.6 6l-2 3.5 2.2 2-.1 2.3-2.1 2 2 3.4 2.8-.9 2 .9L9 22h4l.7-2.8 2-.9 2.8.9 2-3.4-2.2-2v-2.3l2.2-2-2-3.5-2.8.9-2-.9L13 3Z"/><circle cx="11" cy="12.5" r="3.5"/></svg><span>詳しく</span></button>
   </section>
  </section>
  <nav id="part-buttons" class="part-buttons" aria-label="部品を選択" hidden></nav>
  <section id="mechanism-detail" class="mechanism-detail" aria-labelledby="mechanism-heading" hidden>
   <header class="mechanism-header">
    <div><p class="mechanism-eyebrow">機構の動き</p><h2 id="mechanism-heading" tabindex="-1">走行</h2></div>
    <div class="mechanism-status"><span id="mechanism-power">OFF</span><a href="#schematic">回路図のスイッチへ</a></div>
   </header>
   <nav class="mechanism-tabs" aria-label="機構を選択">
    <button type="button" data-mechanism="drive" aria-pressed="true">走行</button>
    <button type="button" data-mechanism="suction" aria-pressed="false">床下の吸引</button>
    <button type="button" data-mechanism="wing" aria-pressed="false">可動翼</button>
    <button type="button" data-mechanism="thrust" aria-pressed="false">ガス噴射</button>
   </nav>
   <ol id="mechanism-flow" class="mechanism-flow" aria-label="動きの伝わり方"></ol>
   <p class="mechanism-pan-hint">図は左右に動かせます</p>
   <div id="mechanism-illustration" class="mechanism-illustration" tabindex="0" aria-label="機構の拡大図"></div>
   <div id="mechanism-captions" class="mechanism-captions"></div>
   <p class="mechanism-note">動きの関係を示す模式図</p>
  </section>
  <p id="announcement" class="sr-only" role="status"></p>
 </main>
 <noscript>JavaScriptを有効にしてください。</noscript>
 <script type="module" src="./app.js"></script>
</body>
</html>
